<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execution Gateway - Postman UI</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        textarea { width: 100%; height: 200px; font-family: monospace; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        pre { background: #282c34; color: #61dafb; padding: 15px; border-radius: 4px; overflow-x: auto; min-height: 100px; }
        .status { font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Postman-Style Order Tester 🚀</h2>
        <p>Send a test <code>OrderIntent</code> JSON payload directly to the Go Execution Gateway.</p>
        
        <label for="payload"><strong>JSON Payload:</strong></label>
        <textarea id="payload">
{
    "trade_uid": "TEST_12345",
    "instrument_token": 145282,
    "side": "BUY",
    "quantity": 65,
    "limit_price": 120.50,
    "exchange_segment": "NSEFO"
}
        </textarea>
        
        <button onclick="sendRequest()">Send Request →</button>

        <h3 style="margin-top: 30px;">Response:</h3>
        <div id="status" class="status" style="color: gray;">Waiting for request...</div>
        <pre id="response">{}</pre>
    </div>

    <script>
        async function sendRequest() {
            const payload = document.getElementById('payload').value;
            const responseBox = document.getElementById('response');
            const statusBox = document.getElementById('status');
            
            responseBox.textContent = "Loading...";
            statusBox.textContent = "Sending request to http://localhost:8080/test-order ...";
            statusBox.style.color = "orange";

            try {
                const res = await fetch('http://localhost:8080/test-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: payload
                });
                const data = await res.json();
                responseBox.textContent = JSON.stringify(data, null, 4);
                statusBox.textContent = `Status: ${res.status} ${res.statusText}`;
                statusBox.style.color = res.ok ? "green" : "red";
            } catch (error) {
                responseBox.textContent = String(error);
                statusBox.textContent = "Error: Could not connect to Execution Gateway on port 8080. Is it running?";
                statusBox.style.color = "red";
            }
        }
    </script>
</body>
</html>
